# タグを打つと Windows の配布物を作り、Releases に下書きで置く。
# 自動更新はここに置かれる latest.json を見に行くので、**署名の鍵が要る**。
#
#   リポジトリの Settings → Secrets and variables → Actions に
#     TAURI_SIGNING_PRIVATE_KEY           鍵ファイルの中身（tenbin-updater.key）
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD  鍵の合言葉（作るとき空にしたなら空のまま）
#
# 手順: package.json と src-tauri/tauri.conf.json の version を上げる → `git tag v0.2.0` → push。
# 下書きの Release を確かめてから publish すると、利用者のアプリが次の起動で気づく。
# **リポジトリが private のあいだは利用者側から latest.json を取れない**（公開にするか、別の置き場所にする）。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # NSIS だけ作る。MSI（WiX）は productName が日本語だと light.exe で落ちるうえ、
          # 自動更新が使うのは NSIS のほう
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: 天秤将棋 __VERSION__
          releaseBody: |
            天秤将棋 __VERSION__

            インストーラ（`*-setup.exe`）を落として実行してください。
            すでに入れている方は、アプリが起動のたびに更新を見に行きます。

            変更の中身はコミットの履歴を見てください。
          releaseDraft: true
          prerelease: false
          # latest.json は自分で作る。製品名が日本語だと GitHub がアセット名から
          # 日本語を落とすので、tauri-action が署名を見つけられない
          includeUpdaterJson: false

      # 配布物に読める名前を付け直し、更新の目録（latest.json）を作る
      - name: 配布物の名前と latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          SETUP=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          NAME="tenbin-shogi_${VERSION}_x64-setup.exe"
          cp "$SETUP" "$NAME"
          SIG=$(cat "${SETUP}.sig")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
          printf '{\n  "version": "%s",\n  "notes": "天秤将棋 %s",\n  "pub_date": "%s",\n  "platforms": {\n    "windows-x86_64": { "signature": "%s", "url": "%s" }\n  }\n}\n' \
            "$VERSION" "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SIG" "$URL" > latest.json
          cat latest.json
          gh release upload "$TAG" "$NAME" latest.json --clobber -R "$GITHUB_REPOSITORY"
          # 日本語が落ちて読めない名前になったものは消す
          for a in $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -E '^_' || true); do
            gh release delete-asset "$TAG" "$a" -y -R "$GITHUB_REPOSITORY"
          done
