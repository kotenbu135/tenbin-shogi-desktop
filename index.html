<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>天秤将棋</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="toolbar" id="toolbar"></header>
      <!-- 上に盤と棋譜、下にタブ（検討・評価値・期待勝率）。仕切りは掴んで動かせる（ShogiHome と同じ割りつけ） -->
      <main class="main" id="main">
        <div class="pane-top">
          <div class="board-col">
            <div class="board-area"><div id="board"></div></div>
            <div class="editor" id="editor" hidden></div>
          </div>
          <div class="split split-v" id="split-v" role="separator" aria-orientation="vertical" aria-label="棋譜の欄の幅" tabindex="0"></div>
          <aside class="record-pane">
            <div class="side-head" id="players"></div>
            <div class="kifu" id="kifu"></div>
          </aside>
        </div>
        <div class="split split-h" id="split-h" role="separator" aria-orientation="horizontal" aria-label="下の欄の高さ" tabindex="0"></div>
        <!-- 下の欄は利用者が組み替える。欄とタブは src/ui/layout.ts が組み立て、中身の要素をここから移す -->
        <div class="pane-bottom" id="bottom"></div>
        <div id="panels" hidden>
          <div class="play-panel" id="play" role="tabpanel"></div>
          <div class="analysis" id="analysis" role="tabpanel"></div>
          <div class="graph" id="graph-score" role="tabpanel"></div>
          <div class="graph" id="graph-winrate" role="tabpanel"></div>
        </div>
      </main>
      <footer class="status" id="status"></footer>
      <div class="console" id="console" hidden></div>
    </div>
    <div id="dialogs"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
